<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Text Generator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; max-width: 700px; margin: auto; }
    input, textarea, button { width: 100%; margin-top: 10px; padding: 10px; font-size: 16px; }
    .result, .history, .auth-section { margin-top: 20px; padding: 15px; background: #f9f9f9; border: 1px solid #ccc; }
    h3 { margin-top: 40px; }
    label { font-weight: bold; }
  </style>
</head>
<body>
  <h2>🧠 AI Prompt Generator</h2>

  <div class="auth-section">
    <h3>🔐 Login</h3>
    <input type="text" id="login-username" placeholder="Username">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="loginUser()">Login</button>

    <h3>📝 Register</h3>
    <input type="text" id="register-username" placeholder="Username">
    <input type="email" id="register-email" placeholder="Email">
    <input type="password" id="register-password" placeholder="Password">
    <button onclick="registerUser()">Register</button>
  </div>

  <h3>✍️ Generate Text</h3>
  <textarea id="prompt" rows="3" placeholder="Write a motivational line..."></textarea>
  <button id="generateBtn">Generate</button>

  <div class="result" id="result"></div>

  <h3>📜 Prompt History</h3>
  <div class="history" id="history"></div>

  <script>
    const resultDiv = document.getElementById("result");
    const historyDiv = document.getElementById("history");

    document.getElementById("generateBtn").addEventListener("click", async function(event) {
      event.preventDefault();

      const token = localStorage.getItem("jwtToken");
      const prompt = document.getElementById("prompt").value.trim();

      if (!token || !prompt) {
        resultDiv.innerHTML = "<b>Please enter a prompt and make sure you're logged in.</b>";
        return;
      }

      try {
        const response = await fetch("http://127.0.0.1:8000/generate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `<b>Generated Text:</b><br>${data.result}<br><b>Remaining Credits:</b> ${data.remaining_credits}`;
          saveToHistory(prompt, data.result);
        } else {
          resultDiv.innerHTML = `<b>Error:</b> ${data.detail}`;
        }
      } catch (error) {
        resultDiv.innerHTML = "<b>Error:</b> Could not connect to server.";
      }
    });

    function saveToHistory(prompt, result) {
      let history = JSON.parse(localStorage.getItem("promptHistory")) || [];
      history.unshift({ prompt, result });
      localStorage.setItem("promptHistory", JSON.stringify(history));
      displayHistory();
    }

    function displayHistory() {
      const history = JSON.parse(localStorage.getItem("promptHistory")) || [];
      historyDiv.innerHTML = history.map(entry => `<p><b>Prompt:</b> ${entry.prompt}<br><b>Result:</b> ${entry.result}</p><hr>`).join("");
    }

    function loginUser() {
      const username = document.getElementById("login-username").value.trim();
      const password = document.getElementById("login-password").value.trim();

      if (!username || !password) {
        alert("Please enter username and password.");
        return;
      }

      const formData = new URLSearchParams();
      formData.append("username", username);
      formData.append("password", password);

      fetch("http://127.0.0.1:8000/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.access_token) {
          localStorage.setItem("jwtToken", data.access_token);
          alert("Login successful!");
        } else {
          alert("Login failed: " + (data.detail || "Unknown error"));
        }
      });
    }

    function registerUser() {
      const username = document.getElementById("register-username").value.trim();
      const email = document.getElementById("register-email").value.trim();
      const password = document.getElementById("register-password").value.trim();

      if (!username || !email || !password) {
        alert("Please fill all fields to register.");
        return;
      }

      fetch("http://127.0.0.1:8000/register", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ username, email, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          alert("Registration successful! Please log in.");
        } else {
          alert("Registration failed: " + (data.detail || "Unknown error"));
        }
      });
    }

    // Load history on page load
    displayHistory();
  </script>
</body>
</html>
